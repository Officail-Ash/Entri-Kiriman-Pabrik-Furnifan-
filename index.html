<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Catatan Kiriman Pabrik Furnifan Mebel Surabaya">

  <title>Catatan Kiriman Pabrik - Furnifan Mebel Surabaya</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">

  <!-- Ikon browser dan iPhone -->
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Catatan Pabrik">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .install {
      position: fixed;
      right: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 10;
      display: none;
      border: 0;
      border-radius: 999px;
      background: #0f766e;
      color: #fff;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 16px #0002;
      cursor: pointer;
    }

    .install:active {
      transform: scale(.97);
    }

    @media (max-width: 768px) {
      .install {
        right: 10px;
        bottom: max(10px, env(safe-area-inset-bottom));
        padding: 11px 14px;
      }
    }
  </style>

  <!-- Daftarkan service worker satu kali saja -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .catch(error => {
            console.error("Service worker gagal didaftarkan:", error);
          });
      });
    }
  </script>
</head>

<body>
  <main class="app">
    <iframe
      src="https://script.google.com/macros/s/AKfycbxwMOg6Ij_uxwdn9JMVSDRWWt7NulD-626qMoXvKpVTbm4DgiJc68GXytgCU6EmgVe0/exec"
      title="Catatan Kiriman Pabrik Furnifan Mebel Surabaya"
      allowfullscreen>
    </iframe>
  </main>

  <button id="installBtn" class="install" type="button">
    ＋ Pasang Aplikasi
  </button>

  <script>
    let installPrompt = null;

    const installBtn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      installPrompt = event;
      installBtn.style.display = "block";
    });

    installBtn.addEventListener("click", async () => {
      if (!installPrompt) {
        alert(
          "Jika tombol pemasangan otomatis tidak tersedia, " +
          "buka menu browser lalu pilih Install app atau " +
          "Tambahkan ke layar utama."
        );
        return;
      }

      installPrompt.prompt();

      await installPrompt.userChoice;
      installPrompt = null;
      installBtn.style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      installBtn.style.display = "none";
      installPrompt = null;
    });
  </script>
</body>
</html>
